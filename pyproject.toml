[project]
name = "frappe_payment_gateway_demo"
authors = [{ name = "Aarti Manjare", email = "aartimanjare@gmail.com" }]
description = "Provider-agnostic online payment flow for ERPNext: signed webhooks, idempotent Payment Entry posting and scheduled reconciliation."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191"]

[tool.ruff.format]
indent-style = "tab"
